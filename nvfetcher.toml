# esbuild binary downloads for the Vite build
[esbuild-aarch64-linux]
src.cmd = "grep -Eo '\"@esbuild/linux-arm64@[0-9.]+' deno.lock | grep -Eo '[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1"
fetch.tarball = "https://registry.npmjs.org/@esbuild/linux-arm64/-/linux-arm64-$ver.tgz"

[esbuild-x86_64-linux]
src.cmd = "grep -Eo '\"@esbuild/linux-x64@[0-9.]+' deno.lock | grep -Eo '[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1"
fetch.tarball = "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-$ver.tgz"

